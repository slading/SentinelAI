name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: SentinelAI Tests
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      SENTINELAI_LLM_MODE: mock
      SENTINELAI_PRIVILEGED_MODE: disabled
      SENTINELAI_DATA_DIR: ${{ runner.temp }}/sentinelai-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run regression tests
        run: >-
          python -m pytest -v
          tests/test_api_security.py
          tests/test_d7a_demo_fixtures.py
          tests/test_d6b_local_e2e.py
      - name: Verify committed files are unchanged
        if: always()
        run: git diff --exit-code HEAD -- .
